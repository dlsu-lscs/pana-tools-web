---
name: Setup Lint Test

on:
    push:
        branches: [main, development]
    pull_request:
        branches: [main, development]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
         - name: checkout repo
           uses: actions/checkout@v5

         - name: setup node.js
           uses: actions/setup-node@v5 
           with:
            node-version: '22'
            cache: 'npm'  
         
         - name: Install dependencies
           run: npm ci

         - name: Run lint
           run: npm run lint
            
         - name: Type check
           run: npx tsc --noEmit

         - name: Run Build
           run: npm run build
           
    
         
